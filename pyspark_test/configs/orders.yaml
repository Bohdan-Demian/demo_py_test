entity: orders
environment: demo
suite: orders_databricks_self_compare

left:
  type: databricks
  table: workspace.default.orderscsv

right:
  type: databricks
  table: workspace.default.orderscsv

keys:
  - order_id

window:
  column: order_date

exclude_columns: []

checks:
  schema:
    enabled: true
    severity: BLOCKING
    enforce_order: false

  partition:
    enabled: true
    severity: BLOCKING
    column: order_date

  row_count:
    enabled: true
    severity: BLOCKING
    tolerance_pct: 0

  key_parity:
    enabled: true
    severity: BLOCKING
    sample_limit: 20

  duplicates:
    enabled: true
    severity: BLOCKING
    sample_limit: 20

  null_rate:
    enabled: true
    severity: NON_BLOCKING
    columns:
      - customer_id
      - product_id
      - order_date
      - quantity
      - total_amount
    tolerances_pct: {}

  aggregates:
    enabled: true
    severity: BLOCKING
    group_by:
      - order_date
    metrics:
      quantity:
        - sum
      total_amount:
        - sum
        - min
        - max
        - avg
      order_id:
        - count
    tolerance: 0

  partition_hash:
    enabled: true
    severity: BLOCKING
    partition_column: order_date
    business_columns:
      - order_id
      - customer_id
      - product_id
      - quantity
      - total_amount

  row_parity:
    enabled: true
    severity: BLOCKING
    compare_columns: null
    exclude_columns: []
    numeric_tolerances:
      total_amount: 0

reporting:
  enabled: false
  runs_table: workspace.default.validation_runs
  checks_table: workspace.default.validation_check_results
