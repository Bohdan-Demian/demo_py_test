entity: products
environment: demo
suite: products_databricks_self_compare

left:
  type: databricks
  table: workspace.default.productscsv

right:
  type: databricks
  table: workspace.default.productscsv

keys:
  - product_id

window:
  column: null

exclude_columns: []

checks:
  schema:
    enabled: true
    severity: BLOCKING
    enforce_order: false

  partition:
    enabled: false
    severity: BLOCKING
    column: null

  row_count:
    enabled: true
    severity: BLOCKING
    tolerance_pct: 0

  key_parity:
    enabled: true
    severity: BLOCKING
    sample_limit: 20

  duplicates:
    enabled: true
    severity: BLOCKING
    sample_limit: 20

  null_rate:
    enabled: true
    severity: NON_BLOCKING
    columns:
      - product_name
      - category
      - price
    tolerances_pct: {}

  aggregates:
    enabled: true
    severity: BLOCKING
    group_by:
      - category
    metrics:
      product_id:
        - count
        - count_distinct
      price:
        - min
        - max
        - avg
    tolerance: 0

  partition_hash:
    enabled: true
    severity: BLOCKING
    partition_column: null
    business_columns:
      - product_id
      - product_name
      - category
      - price

  row_parity:
    enabled: true
    severity: BLOCKING
    compare_columns: null
    exclude_columns: []
    numeric_tolerances:
      price: 0

reporting:
  enabled: false
  runs_table: workspace.default.validation_runs
  checks_table: workspace.default.validation_check_results
