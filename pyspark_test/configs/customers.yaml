entity: customers
environment: demo
suite: customers_databricks_self_compare

left:
  type: databricks
  table: workspace.default.customerscsv

right:
  type: databricks
  table: workspace.default.customerscsv

keys:
  - customer_id

window:
  column: signup_date

exclude_columns: []

checks:
  schema:
    enabled: true
    severity: BLOCKING
    enforce_order: false

  partition:
    enabled: true
    severity: BLOCKING
    column: signup_date

  row_count:
    enabled: true
    severity: BLOCKING
    tolerance_pct: 0

  key_parity:
    enabled: true
    severity: BLOCKING
    sample_limit: 20

  duplicates:
    enabled: true
    severity: BLOCKING
    sample_limit: 20

  null_rate:
    enabled: true
    severity: NON_BLOCKING
    columns:
      - first_name
      - last_name
      - country
      - signup_date
    tolerances_pct: {}

  aggregates:
    enabled: true
    severity: BLOCKING
    group_by:
      - country
    metrics:
      customer_id:
        - count
        - count_distinct
      signup_date:
        - min
        - max
    tolerance: 0

  partition_hash:
    enabled: true
    severity: BLOCKING
    partition_column: signup_date
    business_columns:
      - customer_id
      - first_name
      - last_name
      - country

  row_parity:
    enabled: true
    severity: BLOCKING
    compare_columns: null
    exclude_columns: []
    numeric_tolerances: {}

reporting:
  enabled: false
  runs_table: workspace.default.validation_runs
  checks_table: workspace.default.validation_check_results
