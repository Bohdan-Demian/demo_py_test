[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "pyspark-migration-validation"
version = "0.1.0"
description = "PySpark validation framework for AWS to GCP migration parity testing"
requires-python = ">=3.10"
dependencies = [
    "pyspark>=3.5,<4.0",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "chispa>=0.10.0",
    "ruff>=0.8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
markers = [
    "local_only: tests that rely on local filesystem behavior and are skipped in Databricks demo runs",
]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.ruff.lint.per-file-ignores]
"notebooks/*.py" = ["E402", "F821"]
