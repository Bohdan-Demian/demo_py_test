[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "pyspark-ecommerce-quality-pipeline"
version = "0.1.0"
description = "Training project for PySpark ETL and Big Data QA tests"
requires-python = ">=3.10"
dependencies = [
    "pyspark>=3.5,<4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "chispa>=0.10.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
markers = [
    "local_only: tests that rely on local filesystem behavior and are skipped in Databricks demo runs",
]
